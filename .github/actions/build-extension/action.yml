name: Build Atlas extension
description: Build an extension with current game references and independently selected DLL branches.
inputs:
  project:
    required: true
    description: Extension project path.
  assembly:
    required: true
    description: Assembly name without .dll.
  platform:
    default: Any CPU
    description: MSBuild platform.
  prepare-references:
    default: ''
    description: Optional reference preparation script.
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - uses: actions/checkout@v4
      with:
        repository: atlas-rust-servers/ui-framework
        ref: atlas-hub
        path: .build-tools/ui
        sparse-checkout: /Download-References.ps1
        sparse-checkout-cone-mode: false
    - name: Resolve version
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        BUILDER_PATH: ${{ github.action_path }}
      run: '& "$env:BUILDER_PATH/Resolve-ReleaseVersion.ps1" -Prefix ''atlas-hub-'''
    - name: Download references and build
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        BUILDER_PATH: ${{ github.action_path }}
        PROJECT: ${{ inputs.project }}
        ASSEMBLY: ${{ inputs.assembly }}
        PLATFORM: ${{ inputs.platform }}
        PREPARE_REFERENCES: ${{ inputs.prepare-references }}
      run: '& "$env:BUILDER_PATH/Build-Extension.ps1" -Project $env:PROJECT -Assembly $env:ASSEMBLY -Platform $env:PLATFORM -Version $env:VERSION -PrepareReferences $env:PREPARE_REFERENCES'
