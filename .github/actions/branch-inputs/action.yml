name: Resolve branch build inputs
description: Detect source, parent, Rust and Oxide changes and resolve a reproducible input snapshot.
inputs:
  profile:
    description: Dependency profile path; empty for the UiFramework root.
    default: ''
  force:
    description: Build even when inputs are unchanged.
    default: 'false'
outputs:
  needed:
    value: ${{ steps.resolve.outputs.needed }}
    description: Whether a build is required.
  commit:
    value: ${{ steps.resolve.outputs.commit }}
    description: Source commit to build.
  version:
    value: ${{ steps.resolve.outputs.version }}
    description: Assembly version.
  tag:
    value: ${{ steps.resolve.outputs.tag }}
    description: Automatic release tag.
  inputs:
    value: ${{ steps.resolve.outputs.inputs }}
    description: Exact input snapshot as JSON.
  profile:
    value: ${{ steps.resolve.outputs.profile }}
    description: Resolved dependency profile as JSON.
runs:
  using: composite
  steps:
    - name: Read Linux Rust depot metadata
      if: inputs.profile == ''
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .branch-build/steamcmd
        if ! ldconfig -p | grep -q 'libstdc++.so.6.*libc6)'; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1 lib32stdc++6
        fi
        curl --fail --silent --show-error --location --retry 2 https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz -o .branch-build/steamcmd.tar.gz
        tar -xzf .branch-build/steamcmd.tar.gz -C .branch-build/steamcmd
        timeout 180 .branch-build/steamcmd/steamcmd.sh +login anonymous +app_info_update 1 +app_info_print 258550 +quit > .branch-build/steam-info.txt
    - name: Resolve exact inputs
      id: resolve
      shell: bash
      env:
        PROFILE_PATH: ${{ inputs.profile }}
        FORCE_BUILD: ${{ inputs.force }}
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
      run: |
        node --test "$ACTION_PATH/resolve-inputs.test.js"
        node "$ACTION_PATH/resolve-inputs.js"
