name: Create Release

# NOTE: keep this workflow's skeleton identical to the one on the `atlas-hub` branch.
# Only the downloaded UiFramework variant and the uploaded artifact name differ between branches.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.0

    - name: Setup MSBuild Path
      uses: microsoft/setup-msbuild@v2

    - name: Set VERSION variable from tag
      run: echo "VERSION=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_ENV -Append
      shell: pwsh

    - name: Download References
      run: |
        echo "[Download References] Downloading dependencies"
        mkdir DepotDownloader
        cd DepotDownloader
        Invoke-WebRequest -Uri "https://github.com/SteamRE/DepotDownloader/releases/latest/download/DepotDownloader-windows-x64.zip" -OutFile "DepotDownloader-windows-x64.zip"
        Expand-Archive -Path "DepotDownloader-windows-x64.zip" -DestinationPath "."
        echo 'regex:RustDedicated_Data/Managed/.*\.dll' > filelist.txt
        
        echo "[Download References] Downloading Rust dlls"
        .\DepotDownloader -app 258550 -depot 258552 -filelist filelist.txt -dir "$(pwd)"
        cd ..
        mkdir src\dependencies
        echo "[Download References] Moving Rust dlls"
        Move-Item DepotDownloader\RustDedicated_Data\Managed\*.dll src\dependencies\ -Force
        
        mkdir Oxide
        cd Oxide
        echo "[Download References] Downloading Oxide"
        Invoke-WebRequest -Uri "https://github.com/OxideMod/Oxide.Rust/releases/latest/download/Oxide.Rust.zip" -OutFile "Oxide.Rust.zip"
        Expand-Archive -Path "Oxide.Rust.zip" -DestinationPath "."
        cd ..
        echo "[Download References] Moving Oxide dlls"
        Move-Item Oxide\RustDedicated_Data\Managed\*.dll src\dependencies\ -Force
        
        echo "[Download References] Downloading Oxide.Ext.UiFramework.dll"
        Invoke-WebRequest -Uri "https://github.com/atlas-rust-servers/ui-framework/releases/latest/download/Oxide.Ext.UiFramework.dll" -OutFile "Oxide.Ext.UiFramework.dll"
        Move-Item -Path "Oxide.Ext.UiFramework.dll" -Destination "src\dependencies\" -Force
        
        echo "[Download References] Downloading Oxide.Ext.ConsoleExt.dll"
        Invoke-WebRequest -Uri "https://github.com/ilovepatatos-rust/console-extension/releases/latest/download/Oxide.Ext.ConsoleExt.dll" -OutFile "Oxide.Ext.ConsoleExt.dll"
        Move-Item -Path "Oxide.Ext.ConsoleExt.dll" -Destination "src\dependencies\" -Force
        
        echo "[Download References] Downloading Oxide.Ext.GizmosExt.dll"
        Invoke-WebRequest -Uri "https://github.com/ilovepatatos-rust/gizmos-extension/releases/latest/download/Oxide.Ext.GizmosExt.dll" -OutFile "Oxide.Ext.GizmosExt.dll"
        Move-Item -Path "Oxide.Ext.GizmosExt.dll" -Destination "src\dependencies\" -Force

    - name: Restore NuGet packages
      run: msbuild -t:restore src/IlovepatatosExt/IlovepatatosExt.csproj

    - name: Build DLL
      run: msbuild src/IlovepatatosExt/IlovepatatosExt.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:Version=${{ env.VERSION }}

    - name: Upload Release Assets
      run: |
        $TAG = "${{ github.ref_name }}"
        $repo = "${{ github.repository }}"
        $dll = "src\IlovepatatosExt\bin\Any CPU\Release\net48\Oxide.Ext.IlovepatatosExt.dll"

        gh release view $TAG -R $repo *> $null
        if ($LASTEXITCODE -ne 0) {
          gh release create $TAG -R $repo --title "Release $TAG"
        }

        gh release upload $TAG $dll -R $repo --clobber
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
