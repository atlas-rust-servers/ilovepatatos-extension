name: atlas-hub Release

on:
  push:
    branches: [atlas-hub]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when source and dependencies are unchanged
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: atlas-hub-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.inputs.outputs.needed }}
      commit: ${{ steps.inputs.outputs.commit }}
      version: ${{ steps.inputs.outputs.version }}
      tag: ${{ steps.inputs.outputs.tag }}
      inputs: ${{ steps.inputs.outputs.inputs }}
      profile: ${{ steps.inputs.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas-hub
      - name: Check for source and dependency changes
        id: inputs
        uses: ./.github/actions/branch-inputs
        with:
          profile: 'atlas-hub.dependencies.json'
          force: ${{ inputs.force || false }}

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BUILD_TAG: ${{ needs.check.outputs.tag }}
      BUILD_INPUTS: ${{ needs.check.outputs.inputs }}
      RESOLVED_PROFILE: ${{ needs.check.outputs.profile }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download pinned dependencies
        run: |
          [IO.File]::WriteAllText((Join-Path $PWD 'atlas-hub.dependencies.json'), $env:RESOLVED_PROFILE, [Text.UTF8Encoding]::new($false))
          ./Download-AtlasHubDependencies.ps1

      - name: Build DLL
        run: dotnet build src/IlovepatatosExt/IlovepatatosExt.csproj -c Release '/p:Platform=Any CPU' /p:Version=$env:VERSION

      - name: Verify compiled UiFramework reference
        run: |
          $profile = Get-Content atlas-hub.dependencies.json -Raw | ConvertFrom-Json
          $framework = Get-Content src/dependencies/.downloads/atlas-hub.build.json -Raw | ConvertFrom-Json
          if ($framework.references.platform -ne 'linux' -or -not (Test-Path 'src/dependencies/Facepunch.Steamworks.Posix.dll'))
          {
              throw 'The atlas-hub dependency snapshot must target Linux.'
          }
          $path = 'src/IlovepatatosExt/bin/Any CPU/Release/net48/Oxide.Ext.IlovepatatosExt.dll'
          $identity = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $path))
          if ($identity.Name -ne 'Oxide.Ext.IlovepatatosExt' -or $identity.Version.ToString() -ne "$env:VERSION.0")
          {
              throw "Unexpected assembly identity: $($identity.FullName)"
          }
          $stream = [IO.File]::OpenRead((Resolve-Path $path))
          $reader = [Reflection.PortableExecutable.PEReader]::new($stream)
          try
          {
              $metadata = [Reflection.Metadata.PEReaderExtensions]::GetMetadataReader($reader)
              $found = $false
              foreach ($handle in $metadata.AssemblyReferences)
              {
                  $reference = $metadata.GetAssemblyReference($handle)
                  if ($metadata.GetString($reference.Name) -eq 'Oxide.Ext.UiFramework')
                  {
                      if ($reference.Version.ToString() -ne "$($framework.version).0")
                      {
                          throw "Wrong UiFramework reference: $($reference.Version)"
                      }
                      $found = $true
                  }
              }
              if (-not $found)
              {
                  throw 'Compiled DLL has no UiFramework assembly reference.'
              }
          }
          finally
          {
              $reader.Dispose()
              $stream.Dispose()
          }
          Write-Output "Verified UiFramework reference from $($profile.uiFramework.tag)."

      - name: Package DLL and dependencies
        run: |
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          $assetName = 'atlas-hub_Oxide.Ext.IlovepatatosExt.dll'
          Copy-Item 'src/IlovepatatosExt/bin/Any CPU/Release/net48/Oxide.Ext.IlovepatatosExt.dll' "bin/$assetName"
          $profile = Get-Content atlas-hub.dependencies.json -Raw | ConvertFrom-Json
          $framework = Get-Content src/dependencies/.downloads/atlas-hub.build.json -Raw | ConvertFrom-Json
          $dependencies = @([ordered]@{
              repository = $framework.repository
              branch = $framework.branch
              tag = $framework.tag
              commit = $framework.commit
              manifestSha256 = $profile.uiFramework.manifestSha256
              file = 'Oxide.Ext.UiFramework.dll'
              asset = $framework.asset.file
              sha256 = $framework.asset.sha256
          })
          foreach ($extension in $profile.extensions)
          {
              $dependencies += [ordered]@{
                  repository = $extension.repository
                  tag = $extension.tag
                  file = $extension.file
                  asset = $extension.file
                  sha256 = $extension.sha256
              }
          }
          $references = @(foreach ($file in Get-ChildItem src/dependencies -Filter '*.dll' -File | Sort-Object Name)
          {
              [ordered]@{
                  file = $file.Name
                  sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
          })
          Compress-Archive -Path 'src/dependencies/*.dll' -DestinationPath 'bin/atlas-hub.references.zip'
          $manifest = [ordered]@{
              schema = 1
              repository = $env:GITHUB_REPOSITORY
              branch = 'atlas-hub'
              commit = (git rev-parse HEAD)
              tag = $env:BUILD_TAG
              version = $env:VERSION
              sdk = (dotnet --version)
              targetFramework = 'net48'
              asset = [ordered]@{
                  file = $assetName
                  sha256 = (Get-FileHash "bin/$assetName" -Algorithm SHA256).Hash.ToLowerInvariant()
              }
              dependencies = $dependencies
              buildInputs = $env:BUILD_INPUTS | ConvertFrom-Json
              references = [ordered]@{
                  platform = $framework.references.platform
                  file = 'atlas-hub.references.zip'
                  sha256 = (Get-FileHash 'bin/atlas-hub.references.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
                  assemblies = $references
              }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content bin/atlas-hub.build.json -Encoding utf8

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: atlas-hub-build
          path: bin/*
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atlas-hub-build
          path: bin
      - name: Publish complete prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ needs.check.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          gh release create "$BUILD_TAG" bin/* --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --draft --prerelease --latest=false --title "$BUILD_TAG" --notes "Automatic atlas-hub build from $SOURCE_COMMIT. Exact dependencies and Rust/Oxide inputs are attached."
          gh release edit "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false