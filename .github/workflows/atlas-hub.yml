name: atlas-hub Rolling Build

on:
  push:
    branches: [ "atlas-hub" ]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

env:
  HUB_TAG: atlas-hub-latest
  ASSET_NAME: atlas-hub_Oxide.Ext.IlovepatatosExt.dll

jobs:
  # A push to ui-framework cannot start a workflow here, so the schedule polls its
  # rolling asset instead: the fingerprint of the last build is kept in the release
  # notes and only a change starts the Windows job.
  check:

    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.fingerprint.outputs.changed }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}

    steps:
      - name: Compare fingerprint
        id: fingerprint
        shell: bash
        run: |
          self=$(gh api "repos/$GITHUB_REPOSITORY/commits/atlas-hub" --jq '.sha')
          ui=$(gh api "repos/atlas-rust-servers/ui-framework/releases/tags/$HUB_TAG" --jq '.assets[] | select(.name=="atlas-hub_Oxide.Ext.UiFramework.dll") | .id' 2>/dev/null)
          fingerprint="self=$self ui=$ui"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "current: $fingerprint"

          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous=$(gh release view "$HUB_TAG" -R "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null | grep -o 'fingerprint: .*' | sed 's/^fingerprint: //')
          echo "previous: $previous"

          if [ "$previous" = "$fingerprint" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:

    needs: check
    if: needs.check.outputs.changed == 'true'

    runs-on: windows-latest

    steps:
      - name: Checkout atlas-hub
        uses: actions/checkout@v4
        with:
          ref: atlas-hub
          fetch-depth: 0

      - name: Setup MSBuild Path
        uses: microsoft/setup-msbuild@v2

      - name: Resolve version
        shell: pwsh
        run: |
          $latestTag = git tag -l --sort=-v:refname | Where-Object { $_ -match '^v?\d+\.\d+\.\d+$' } | Select-Object -First 1
          if (-not $latestTag) {
            $latestTag = "0.0.0"
          }
          echo "VERSION=$($latestTag.TrimStart('v')).${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download References
        shell: pwsh
        run: |
          echo "[Refs] Rust + Oxide + public extensions"
          ./dependencies-download.ps1

          echo "[Refs] atlas-hub variant: UiFramework (prefixed asset -> saved WITHOUT prefix)"
          Invoke-WebRequest -Uri "https://github.com/atlas-rust-servers/ui-framework/releases/download/${{ env.HUB_TAG }}/atlas-hub_Oxide.Ext.UiFramework.dll" -OutFile "src/dependencies/Oxide.Ext.UiFramework.dll"

      - name: Build DLL - atlas-hub
        run: |
          msbuild -t:restore src/IlovepatatosExt/IlovepatatosExt.csproj
          msbuild src/IlovepatatosExt/IlovepatatosExt.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:Version=${{ env.VERSION }}

      - name: Stage asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item "src/IlovepatatosExt/bin/Any CPU/Release/net48/Oxide.Ext.IlovepatatosExt.dll" "bin/${{ env.ASSET_NAME }}" -Force

      - name: Publish rolling pre-release
        shell: pwsh
        run: |
          gh release view $env:HUB_TAG -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:HUB_TAG --title "atlas-hub rolling build" --notes "bootstrap" --prerelease --target atlas-hub -R $env:GITHUB_REPOSITORY
          }
          gh release upload $env:HUB_TAG "bin/$env:ASSET_NAME" -R $env:GITHUB_REPOSITORY --clobber
          $notes = "Rolling build of the atlas-hub branch. Version $env:VERSION, commit $env:GITHUB_SHA, run #$env:GITHUB_RUN_NUMBER.`n`nfingerprint: ${{ needs.check.outputs.fingerprint }}"
          gh release edit $env:HUB_TAG --notes $notes -R $env:GITHUB_REPOSITORY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
