name: atlas-hub Release
on:
  push:
    branches: [atlas-hub]
  pull_request:
    branches: [atlas-hub]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ilove-atlas-hub-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-extension
        with:
          project: src/IlovepatatosExt/IlovepatatosExt.csproj
          assembly: Oxide.Ext.IlovepatatosExt
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-hub-build
          path: bin/*
          if-no-files-found: error
      - name: Publish branch release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content bin/atlas-hub.build.json -Raw | ConvertFrom-Json
          $assets = @(Get-ChildItem bin -File | Select-Object -ExpandProperty FullName)
          gh release create $manifest.tag @assets --repo $env:GITHUB_REPOSITORY --target $manifest.commit --prerelease --latest=false --title $manifest.tag --notes 'IlovepatatosExt atlas-hub build with current references and selected DLL branches.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
